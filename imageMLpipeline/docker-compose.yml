version: '3.8'

services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-node-with-deps
    container_name: spark-master
    user: root
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      - SPARK_MODE=master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      spark-net:
        ipv4_address: 172.20.0.2

  spark-worker-1:
    image: spark-node-with-deps
    container_name: spark-worker-1
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - /home/cedric/imageMLpipeline/parquet_output:/app/parquet_output
      - /home/cedric/imageMLpipeline/processed_images:/app/processed_images
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    networks:
      spark-net:
        ipv4_address: 172.20.0.3

  spark-worker-2:
    image: spark-node-with-deps
    container_name: spark-worker-2
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - /home/cedric/imageMLpipeline/parquet_output:/app/parquet_output
      - /home/cedric/imageMLpipeline/processed_images:/app/processed_images
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8082
    networks:
      spark-net:
        ipv4_address: 172.20.0.4

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-ml-pipeline
    container_name: image-app
    stdin_open: true
    tty: true
    depends_on:
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      # 當使用固定 IP 時，建議將 SPARK_LOCAL_IP 設為容器自身的固定 IP
      - SPARK_LOCAL_IP=172.20.0.5
    command: bash run.sh
    volumes:
      - /home/cedric/imageMLpipeline/parquet_output:/app/parquet_output
      - /home/cedric/imageMLpipeline/processed_images:/app/processed_images
    networks:
      spark-net:
        ipv4_address: 172.20.0.5

networks:
  spark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
