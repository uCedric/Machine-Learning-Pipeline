networks:
  data-net:
    name: MLpipeline-net
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  minio-data:
  postgres-data:

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Kafka Broker (KRaft mode — no ZooKeeper) ──────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "9092:9092"   # external (host) access
      - "29092:29092" # internal (container-to-container) access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "69ec2bb9-9844-46ab-a33e-06d46baf2af2"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ── MinIO bucket bootstrap (one-shot) ─────────────────────────────────────
  # Waits for MinIO, creates the image + models buckets, then uploads the
  # PatchCore model assets to models/base/.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    networks:
      - data-net
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      MODELS_BUCKET: ${MODELS_BUCKET}
    volumes:
      - ./inference-service/adapters/outbound/patchcore/asset:/assets:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$IMAGES_BUCKET;
      mc mb --ignore-existing local/$$MODELS_BUCKET;
      mc cp /assets/memory_bank.npy local/$$MODELS_BUCKET/patchcore/1.0.0/;
      mc cp /assets/resnet_backbone.onnx local/$$MODELS_BUCKET/patchcore/1.0.0/;
      mc cp /assets/resnet_backbone.onnx.data local/$$MODELS_BUCKET/patchcore/1.0.0/;
      mc cp /assets/buffer_zone.txt local/$$MODELS_BUCKET/patchcore/1.0.0/;
      echo 'minio buckets ready';
      "

  # ── PostgreSQL (inference results store) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Flyway schema migration (one-shot) ────────────────────────────────────
  # Waits for Postgres, then applies the versioned migrations in ./migrations
  # (V1__init.sql, ...). Flyway records applied versions in its schema-history
  # table, so re-runs are no-ops until a new V*__*.sql is added.
  flyway:
    image: flyway/flyway:11-alpine
    container_name: flyway
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: migrate

  # ── ELT (image ingest → MinIO → Kafka "inference" event) ──────────────────
  elt:
    build: ./inference-service
    image: pipeline-app
    container_name: elt
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      ELT_INPUT_FOLDER: /app/data
      ELT_PROCESSED_DIR: /data/processed
      ELT_POLL_INTERVAL: ${ELT_POLL_INTERVAL}
    volumes:
      - ./data:/data
    command: python -m bootstrap.elt

  # ── Inference microservice (Kafka consumer → model → Postgres) ────────────
  # Replaces the old spark-submit driver. Inference runs in pure Python.
  inference-service:
    build: ./inference-service
    image: pipeline-app
    container_name: inference-service
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: inference-service
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      MODEL_NAME: ${MODEL_NAME}
    command: python -m bootstrap.inference

  # ── Train microservice (Kafka consumer for 'train' events) ────────────────
  # Mirrors inference-service's hexagonal layout; currently just logs receipt.
  train-service:
    build: ./train-service
    image: train-app
    container_name: train-service
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: train
      KAFKA_GROUP_ID: train-service
      KAFKA_EVENT_TYPE: train
    command: python -m bootstrap.train

  # ── Monitor (FastAPI dashboard over inference_results) ────────────────────
  # Read-only web UI: reads results from Postgres and proxies image/heatmap
  # bytes from MinIO. Open http://localhost:8000 once the stack is up.
  monitor-service:
    build: ./monitor-service
    image: monitor-app
    container_name: monitor-service
    restart: on-failure
    networks:
      - data-net
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  # ── Spark Master ───────────────────────────────────────────────────────────
  # Retained cluster. Not used by the inference path for now.
  spark-master:
    build: .
    image: spark-app
    container_name: spark-master
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "7077:7077"   # Spark master RPC
      - "8081:8080"   # Spark master Web UI
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Spark Worker 1 ─────────────────────────────────────────────────────────
  spark-worker-1:
    image: spark-app
    container_name: spark-worker-1
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8082:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081

  # ── Spark Worker 2 ─────────────────────────────────────────────────────────
  spark-worker-2:
    image: spark-app
    container_name: spark-worker-2
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8083:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081

  # ── Spark Worker 3 ─────────────────────────────────────────────────────────
  spark-worker-3:
    image: spark-app
    container_name: spark-worker-3
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8084:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
