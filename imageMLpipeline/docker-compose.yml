networks:
  data-net:
    name: MLpipeline-net
    driver: bridge

# ── Shared Spark environment ─────────────────────────────────────────────────
# The stage-one batch job builds its ports from the *executor's* environment
# (nothing is serialised from the driver), so every master/worker container
# needs the same MinIO/Postgres/model settings the inference service has.
x-spark-env: &spark-env
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
  IMAGES_BUCKET: ${IMAGES_BUCKET}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
  POSTGRES_DB: ${POSTGRES_DB}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_KEY: ${MODEL_KEY}
  # How many slices a micro-batch is cut into. Slices are *tasks*, not model
  # copies — with worker reuse a queued task lands on an already-warm Python
  # worker, so raising this is cheap.
  SPARK_MASTER_URL: spark://spark-master:7077
  SPARK_PARTITIONS: ${SPARK_PARTITIONS:-6}
  # Read by the *worker* daemons (the master ignores it): how many task slots one
  # container advertises. This is the real cap on PatchCore copies — a slot is a
  # concurrent task, a concurrent task is a Python worker, and every Python worker
  # holds its own ONNX session + FAISS index. Left unset, a worker offers every
  # core on the host and the cluster would happily build a dozen copies.
  SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-3}
  # Executors download their own images: this is how many of those object-storage
  # reads one Python worker overlaps while assembling a mini-batch.
  SPARK_FETCH_WORKERS: ${SPARK_FETCH_WORKERS:-8}

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
  minio-data:
  postgres-data:

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Kafka Broker (KRaft mode — no ZooKeeper) ──────────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "9092:9092"   # external (host) access
      - "29092:29092" # internal (container-to-container) access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "69ec2bb9-9844-46ab-a33e-06d46baf2af2"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ── MinIO bucket bootstrap (one-shot) ─────────────────────────────────────
  # Waits for MinIO, creates the image + models buckets, then uploads the
  # PatchCore model assets to models/base/.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    networks:
      - data-net
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      MODELS_BUCKET: ${MODELS_BUCKET}
      MODEL_KEY: ${MODEL_KEY}
      MODEL_VERSION: ${MODEL_VERSION}
    volumes:
      - ./inference-service/adapters/outbound/patchcore/asset:/assets:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...'; sleep 2;
      done;
      DEST=local/$$MODELS_BUCKET/$$MODEL_KEY/$$MODEL_VERSION/;
      mc mb --ignore-existing local/$$IMAGES_BUCKET;
      mc mb --ignore-existing local/$$MODELS_BUCKET;
      mc cp /assets/memory_bank.npy $$DEST;
      mc cp /assets/resnet_backbone.onnx $$DEST;
      mc cp /assets/resnet_backbone.onnx.data $$DEST;
      mc cp /assets/buffer_zone.txt $$DEST;
      echo 'minio buckets ready';
      "

  # ── PostgreSQL (inference results store) ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Flyway schema migration (one-shot) ────────────────────────────────────
  # Waits for Postgres, then applies the versioned migrations in ./migrations
  # (V1__init.sql, ...). Flyway records applied versions in its schema-history
  # table, so re-runs are no-ops until a new V*__*.sql is added.
  flyway:
    image: flyway/flyway:11-alpine
    container_name: flyway
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: migrate

  # ── ELT (image ingest → MinIO → Kafka "inference" event, type=stage-one) ──
  elt:
    build: ./inference-service
    image: pipeline-app
    container_name: elt
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_EVENT_TYPE: ${KAFKA_EVENT_TYPE}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      ELT_INPUT_FOLDER: /app/data
      ELT_PROCESSED_DIR: /data/processed
      ELT_POLL_INTERVAL: ${ELT_POLL_INTERVAL}
    volumes:
      - ./data:/data
    command: python -m bootstrap.elt

  # ── Inference (single consumer → both stages, routed by event 'type') ──────
  # Consumes the "inference" topic. type=stage-one runs PatchCore anomaly; on an
  # ANOMALY verdict it re-publishes the same event as type=stage-two,
  # which this same service then consumes and batch-clusters (ResNet50) into
  # cluster_results. DINOv2 is registered is_valid=false and is not built.
  inference-service:
    build: ./inference-service
    image: pipeline-app
    container_name: inference-service
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_EVENT_TYPE: ${KAFKA_EVENT_TYPE}
      KAFKA_GROUP_ID: inference-service
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      MODEL_NAME: ${MODEL_NAME}
      # Stage-one anomaly model (also names the model whose 'normal' verdicts
      # supply stage-two's known-good baseline).
      MODEL_KEY: ${MODEL_KEY}
      # Stage-two clustering backbone + batch tuning. CLUSTER_MODEL_KEY selects
      # the backbone; STAGE_TWO_TRIGGER_STATUSES are the verdicts that trigger it
      # ('anomaly' only — 'pending' goes to human review, not to clustering).
      CLUSTER_MODEL_NAME: ${CLUSTER_MODEL_NAME:-resnet50}
      CLUSTER_MODEL_KEY: ${CLUSTER_MODEL_KEY:-resnet50}
      CLUSTER_MODEL_IMAGE_SIZE: ${CLUSTER_MODEL_IMAGE_SIZE:-448}
      STAGE_TWO_TRIGGER_STATUSES: ${STAGE_TWO_TRIGGER_STATUSES}
      STAGE_TWO_MIN_BATCH: ${STAGE_TWO_MIN_BATCH:-15}
      # Two accumulation gates. ASSIGN_COUNT new anomalies are labelled against
      # the current version's frozen fit (cheap, ids stay comparable); REFIT_COUNT
      # new anomalies since the last fit redraw the clusters and freeze a new
      # model version. Progress lives in stage_two_run, so restarts resume.
      STAGE_TWO_ASSIGN_COUNT: ${STAGE_TWO_ASSIGN_COUNT:-500}
      STAGE_TWO_REFIT_COUNT: ${STAGE_TWO_REFIT_COUNT:-1000}
      STAGE_TWO_NORMAL_SET_SIZE: ${STAGE_TWO_NORMAL_SET_SIZE:-200}
      STAGE_TWO_DEFECT_SET_SIZE: ${STAGE_TWO_DEFECT_SET_SIZE:-5000}
      # Stage-one scoring runs on the Spark cluster. This container hosts the
      # driver in client mode, so SPARK_DRIVER_HOST must be a name the executors
      # can resolve — the compose service name — and the two ports below are
      # pinned so the workers can call back to it.
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_MICRO_BATCH_SIZE: ${SPARK_MICRO_BATCH_SIZE:-32}
      SPARK_POLL_TIMEOUT_MS: ${SPARK_POLL_TIMEOUT_MS:-2000}
      SPARK_PARTITIONS: ${SPARK_PARTITIONS:-6}
      # How many images predict_batch_udf feeds the backbone per call. Read here
      # because the driver is where the UDF is built; the executors' own knob
      # (SPARK_FETCH_WORKERS) lives in the shared Spark environment above.
      SPARK_UDF_BATCH_SIZE: ${SPARK_UDF_BATCH_SIZE:-8}
      SPARK_DRIVER_HOST: inference-service
      SPARK_DRIVER_PORT: 40001
      SPARK_BLOCK_MANAGER_PORT: 40002
    expose:
      - "40001"   # Spark driver RPC (executors call back)
      - "40002"   # Spark block manager
    command: python -m bootstrap.inference

  # ── Train microservice (Kafka consumer for 'train' events) ────────────────
  # Mirrors inference-service's hexagonal layout: on a 'train' event it embeds
  # the referenced image with the model's ONNX backbone, appends the vectors to
  # the memory bank, writes the new bank to a patch+1 version in MinIO and
  # registers it in inference_model as a not-yet-valid candidate.
  train-service:
    build: ./train-service
    image: train-app
    container_name: train-service
    restart: on-failure
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: train
      KAFKA_GROUP_ID: train-service
      KAFKA_EVENT_TYPE: train
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      MODEL_NAME: ${MODEL_NAME}
      # The model version/bucket are resolved from the inference_model table;
      # MODEL_KEY selects which model_type to retrain.
      MODEL_KEY: ${MODEL_KEY}
      # Rolling validation set: how many recent known-good (status='normal')
      # images to re-score when recalibrating the buffer zone after a retrain.
      VALIDATION_SET_SIZE: ${VALIDATION_SET_SIZE:-200}
    command: python -m bootstrap.train

  # ── Monitor (FastAPI dashboard over inference_results) ────────────────────
  # Read-only web UI: reads results from Postgres and proxies image/heatmap
  # bytes from MinIO. Open http://localhost:8000 once the stack is up.
  monitor-service:
    build: ./monitor-service
    image: monitor-app
    container_name: monitor-service
    restart: on-failure
    networks:
      - data-net
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (set it in .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (set it in .env)}
      IMAGES_BUCKET: ${IMAGES_BUCKET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TRAIN_TOPIC: train
      # Share of assigned images matching no cluster at which the dashboard stops
      # calling stage-two healthy. Advisory only — a drifting verdict asks a human
      # to review the clustering algorithm; nothing re-fits automatically.
      STAGE_TWO_DRIFT_NOISE_RATIO: ${STAGE_TWO_DRIFT_NOISE_RATIO:-0.30}
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  # ── Spark Master ───────────────────────────────────────────────────────────
  # Allocation only — no driver runs here. The stage-one driver lives inside
  # inference-service (client mode), which registers at start-up and holds its
  # executors for the life of the service.
  spark-master:
    build: .
    image: spark-app
    container_name: spark-master
    restart: unless-stopped
    networks:
      - data-net
    depends_on:
      minio-init:
        condition: service_completed_successfully
      flyway:
        condition: service_completed_successfully
    ports:
      - "7077:7077"   # Spark master RPC
      - "8081:8080"   # Spark master Web UI
    environment: *spark-env
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Spark Worker 1 ─────────────────────────────────────────────────────────
  spark-worker-1:
    image: spark-app
    container_name: spark-worker-1
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8082:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    environment: *spark-env
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081

  # ── Spark Worker 2 ─────────────────────────────────────────────────────────
  spark-worker-2:
    image: spark-app
    container_name: spark-worker-2
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8083:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    environment: *spark-env
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081

  # ── Spark Worker 3 ─────────────────────────────────────────────────────────
  spark-worker-3:
    image: spark-app
    container_name: spark-worker-3
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8084:8081"   # Worker Web UI
    depends_on:
      spark-master:
        condition: service_healthy
    environment: *spark-env
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
